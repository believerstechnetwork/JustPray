<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Just Pray: a free monthly prayer gathering for people in tech</title>
    <meta
      name="description"
      content="Once a month in Lagos, people who work in technology stop and pray. Free to attend."
    />
    <meta
      property="og:title"
      content="Just Pray: a free monthly prayer gathering for people in tech"
    />
    <meta
      property="og:description"

    <!-- og:image must be a hosted absolute URL in production so Facebook and LinkedIn can show the share card -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <linearGradient id="sg" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" style="stop-color: var(--st1)" stop-opacity="0" />
          <stop offset=".45" style="stop-color: var(--st2)" stop-opacity=".85" />
          <stop offset="1" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
      </defs>
    </svg>
    <a class="skip" href="#main">Skip to content</a>
    <div class="viewport">
      <div class="site" id="page"></div>
    </div>
